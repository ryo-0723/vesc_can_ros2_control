# vesc_five_modes.urdf と組み合わせる、5モードのコントローラ設定
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    drive_controller:
      type: forward_command_controller/ForwardCommandController
    steer_controller:
      type: forward_command_controller/ForwardCommandController
    current_controller:
      type: forward_command_controller/ForwardCommandController
    hybrid_controller:
      type: forward_command_controller/ForwardCommandController
    duty_controller:
      type: forward_command_controller/ForwardCommandController
joint_state_broadcaster:
  ros__parameters:
    update_rate: 50
    joints: [drive_joint, steer_joint, current_joint, hybrid_joint, duty_joint]
    interfaces: [position, velocity]
drive_controller:
  ros__parameters:
    joints: [drive_joint]
    interface_name: velocity
steer_controller:
  ros__parameters:
    joints: [steer_joint]
    interface_name: position
current_controller:
  ros__parameters:
    joints: [current_joint]
    interface_name: current
hybrid_controller:
  ros__parameters:
    joints: [hybrid_joint]
    interface_name: current_velocity
duty_controller:
  ros__parameters:
    joints: [duty_joint]
    interface_name: duty_cycle
