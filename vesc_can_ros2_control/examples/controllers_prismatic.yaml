# vesc_prismatic.urdf と組み合わせる。配列の単位は順に m/s、rad/s。
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    velocity_controller:
      type: forward_command_controller/ForwardCommandController
joint_state_broadcaster:
  ros__parameters:
    update_rate: 50
    joints: [slider_joint, rotary_joint]
    interfaces: [position, velocity]
velocity_controller:
  ros__parameters:
    joints: [slider_joint, rotary_joint]
    interface_name: velocity
