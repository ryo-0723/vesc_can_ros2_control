# 通常ノードの5モード例: 速度・位置・電流・速度＋電流・duty比
# 模擬CAN用のトピックを使用する
/**/vesc_can_driver:
  ros__parameters:
    can_tx_topic: bench/can/tx
    can_rx_topic: bench/can/rx
    command_topic: vesc/commands
    state_topic: vesc/state
    error_topic: vesc/event
    fault_poll_period_ms: 100
    update_period_ms: 10
    state_publish_period_ms: 20
    motors:
      - drive_joint
      - steer_joint
      - current_joint
      - hybrid_joint
      - duty_joint

    drive_joint:
      logical_id: 1
      controller_id: 11
      control_mode: velocity
      pole_pairs: 7.0
      max_rpm: 190.0
      rpm_slew_rate: 955.0
      feedback_timeout_ms: 300
      command_timeout_ms: 300
    steer_joint:
      logical_id: 2
      controller_id: 21
      control_mode: position
      pole_pairs: 7.0
      min_position: -1.0
      max_position: 1.0
      feedback_timeout_ms: 300
      command_timeout_ms: 300
    current_joint:
      logical_id: 3
      controller_id: 12
      control_mode: current
      pole_pairs: 7.0
      direction: -1.0
      max_current_a: 3.0
      feedback_timeout_ms: 300
      command_timeout_ms: 300
    hybrid_joint:
      logical_id: 4
      controller_id: 31
      control_mode: current_velocity
      pole_pairs: 7.0
      max_rpm: 190.0
      rpm_slew_rate: 955.0
      max_current_a: 3.0
      startup_current_a: 2.0
      rpm_control_threshold_rpm: 50.0
      startup_timeout_ms: 1000
      feedback_timeout_ms: 300
      command_timeout_ms: 300

    duty_joint:
      logical_id: 5
      controller_id: 41
      control_mode: duty_cycle
      pole_pairs: 7.0
      direction: -1.0
      max_duty: 0.5
      feedback_timeout_ms: 300
      command_timeout_ms: 300
