name: ROS 2 Lyrical
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:lyrical-ros-base
    env:
      ROS_DOMAIN_ID: 91
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/vesc_can_ros2_control
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep clang-format black
          rosdep update --rosdistro lyrical
          rosdep install --from-paths ws/src/vesc_can_ros2_control --ignore-src -r -y --rosdistro lyrical
      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            ws/src/vesc_can_ros2_control/vesc_can_ros2_control/include/vesc_can_ros2_control/*.hpp \
            ws/src/vesc_can_ros2_control/vesc_can_ros2_control/src/*.cpp \
            ws/src/vesc_can_ros2_control/vesc_can_ros2_control/test/*.cpp
          black --check --line-length 100 \
            ws/src/vesc_can_ros2_control/vesc_can_ros2_control/launch \
            ws/src/vesc_can_ros2_control/vesc_can_ros2_control/test/test_integration.py
      - name: Build
        working-directory: ws
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --packages-up-to vesc_can_ros2_control --cmake-args -DBUILD_TESTING=ON
      - name: Test
        working-directory: ws
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --packages-select vesc_can_ros2_control --event-handlers console_direct+
          colcon test-result --verbose
